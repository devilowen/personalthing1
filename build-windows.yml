name: Build standalone Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip Pillow "pyinstaller>=6.10,<7"
      - name: Build one-file Windows executable
        shell: cmd
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BilgeOverlay --add-data "config.json;." app.py
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: BilgeOverlay-Windows
          path: dist/BilgeOverlay.exe
          if-no-files-found: error
